{% extends 'gestion/base_gestion.html' %}

{% block title %}Eliminar {{ mod.nombre }}{% endblock %}

{% block content %}
<section class="panel management-panel form-panel">
  <p class="eyebrow danger-text">Baja</p>
  <h1>Eliminar mod</h1>
  <div class="delete-warning">
    <p>Estás por eliminar el mod <strong>{{ mod.nombre }}</strong>.</p>
    <p class="muted">Esta acción elimina el registro guardado en Django.</p>
  </div>
  <form method="post" class="form-actions">
    {% csrf_token %}
    <button class="danger-button" type="submit">Sí, eliminar</button>
    <a class="button-link button-secondary" href="{% url 'stats:mods_gestion' %}">Cancelar</a>
  </form>
</section>
{% endblock %}
